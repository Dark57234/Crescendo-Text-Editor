<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Crescendo Player</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; }
        #player { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="player"></div>

    <script>
        // 1) Load YouTube's official player library
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        var player;
        var ready = false;
        var pendingVideoId = null;   // a video requested before the player was ready

        // Sends an event to Java and also logs it. window.cefQuery only exists inside JCEF.
        function sendToJava(message) {
            console.log(message);
            if (window.cefQuery) {
                window.cefQuery({
                    request: message,
                    onSuccess: function () {},
                    onFailure: function () {}
                });
            }
        }

        // 2) YouTube calls this function by itself when its library has loaded
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                width: '100%',
                height: '100%',
                playerVars: {
                    playsinline: 1,
                    origin: window.location.origin   // "http://127.0.0.1:PORT"
                },
                events: {
                    onReady: function () {
                        ready = true;
                        sendToJava('READY');
                        if (pendingVideoId) {
                            player.loadVideoById(pendingVideoId);
                            pendingVideoId = null;
                        }
                    },
                    onStateChange: function (e) {
                        if (e.data === YT.PlayerState.PLAYING) {
                            sendToJava('PLAYING');
                        } else if (e.data === YT.PlayerState.PAUSED) {
                            sendToJava('PAUSED');
                        } else if (e.data === YT.PlayerState.ENDED) {
                            sendToJava('ENDED');
                        }
                    },
                    onError: function (e) {
                        sendToJava('ERROR ' + e.data);
                    }
                }
            });
        }

        // 3) Functions Java calls through executeJavaScript
        function loadVideo(id) {
            if (ready) {
                player.loadVideoById(id);
            } else {
                pendingVideoId = id;   // not ready yet: play it as soon as it is
            }
        }
        function pauseVideo()  { if (ready) player.pauseVideo(); }
        function resumeVideo() { if (ready) player.playVideo(); }
        function seekTo(sec)   { if (ready) player.seekTo(sec, true); }
    </script>
</body>
</html>
